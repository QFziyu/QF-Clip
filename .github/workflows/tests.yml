name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      DEVICE: cpu
      COMPUTE_TYPE: int8
      SUBTITLE_REVIEW_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Locate FFmpeg
        shell: pwsh
        run: |
          $ffmpegExe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'FFmpeg executable was not found' }
          "FFMPEG_PATH=$($ffmpegExe.FullName)" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$(Join-Path $ffmpegExe.DirectoryName 'ffprobe.exe')" >> $env:GITHUB_ENV
      - name: Run regression tests
        run: python scripts/run_tests.py
      - name: Verify generated media end to end
        if: matrix.python-version == '3.13'
        run: python scripts/verify_workbench.py --destination "$env:RUNNER_TEMP/fcf-media"
